# Cloudflare Worker: Cron Triggers that start the bot's GitHub workflows on time.
# Deployed by .github/workflows/scheduler-deploy.yml (secret GH_DISPATCH_TOKEN).
name = "va-scheduler"
main = "worker.js"
compatibility_date = "2025-06-01"
workers_dev = false

[triggers]
# One trigger every 5 minutes; worker.js (SLOTS) decides what runs at each time.
crons = ["*/5 * * * *"]
