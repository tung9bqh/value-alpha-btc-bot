name: BTC Daily Strategy (EN channel)

on:
  schedule:
    # 01:10 UTC = 08:10 Vietnam time. GitHub cron often starts late, so the job
    # starts early and the script waits until exactly 08:30 before posting.
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only preview the post + chart (do not send to Telegram)"
        type: boolean
        default: true

permissions:
  contents: write  # plan history on the 'state' branch, dry-run preview on 'preview'

concurrency:
  group: btc-bot-state  # shared with the alert tracker so the plan history is never written twice
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install chart library
        run: pip install --quiet matplotlib
      - name: Load plan history
        run: bash .github/scripts/state.sh load
      - name: Post BTC daily strategy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # ENGLISH channel only. Override with the TELEGRAM_CHAT_ID_EN secret if needed.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_EN || '@valuealphacrypto' }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python btc_daily_bot.py --dry-run --state-dir state | tee preview.txt
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python btc_daily_bot.py --wait-until 08:30 --state-dir state --once-per-day
          else
            python btc_daily_bot.py --state-dir state --once-per-day
          fi
      - name: Save plan history
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/state.sh save
      - name: Save chart image (download from the run's Summary page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-plan-chart
          path: btc_plan.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save preview to the 'preview' branch
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/preview && cp btc_plan.png preview.txt /tmp/preview/
          cd /tmp/preview
          git init -q -b preview
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Preview $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" preview
