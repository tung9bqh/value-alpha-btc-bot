name: Post NOW to EN channel

# Manual button: posts today's BTC strategy to the English channel immediately.
on:
  workflow_dispatch:

permissions:
  contents: write  # plan history on the 'state' branch

concurrency:
  group: btc-bot-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install chart library
        run: pip install --quiet matplotlib
      - name: Load plan history
        run: bash .github/scripts/state.sh load
      - name: Post BTC daily strategy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_EN || '@valuealphacrypto' }}
        run: python btc_daily_bot.py --state-dir state
      - name: Save plan history
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/state.sh save
